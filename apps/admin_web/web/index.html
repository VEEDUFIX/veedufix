<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VeeduFix Admin Panel" />
    <title>VeeduFix Admin</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f5f6f8;
        color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-shell {
        align-items: center;
        display: flex;
        min-height: 100vh;
        justify-content: center;
      }

      .boot-panel {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        box-shadow: 0 16px 50px rgba(17, 24, 39, 0.08);
        padding: 24px 28px;
        text-align: center;
      }

      .boot-mark {
        background: #111827;
        border-radius: 8px;
        color: #ffffff;
        display: inline-flex;
        font-size: 18px;
        font-weight: 800;
        height: 44px;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
        width: 44px;
      }

      .boot-title {
        font-size: 16px;
        font-weight: 800;
        margin: 0;
      }

      .boot-copy {
        color: #6b7280;
        font-size: 13px;
        margin: 6px 0 0;
      }
    </style>
  </head>
  <body>
    <div class="boot-shell" id="boot-shell">
      <div class="boot-panel">
        <div class="boot-mark">VF</div>
        <p class="boot-title">Loading VeeduFix Admin</p>
        <p class="boot-copy">Preparing your dashboard.</p>
      </div>
    </div>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
