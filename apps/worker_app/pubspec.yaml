name: worker_app
description: Worker app for the local services marketplace.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  marketplace_shared:
    path: ../../packages/marketplace_shared
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.1
  firebase_database: ^11.3.3
  firebase_messaging: ^15.2.10
  firebase_storage: ^12.3.6
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  flutter_image_compress: ^2.5.1
  cloud_firestore: ^5.6.6
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.3
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  lottie: ^3.3.0
  sentry_flutter: ^9.25.0
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.3
  custom_refresh_indicator: ^4.0.1
  sensors_plus: ^7.1.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/partner_logo.svg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher_icon.png"
  web:
    generate: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/launcher_icon.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/launcher_icon.png"
