# Local development stack. Do not expose these ports or use these defaults in production.
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: veedufix
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/veedufix?schema=public"
      DIRECT_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/veedufix?schema=public"
      REDIS_URL: redis://redis:6379
      APP_CORS_ORIGIN: "http://localhost,http://localhost:80,http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin_web:
    build:
      context: .
      dockerfile: apps/admin_web/Dockerfile
      args:
        API_BASE_URL: http://localhost:5000/api
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
