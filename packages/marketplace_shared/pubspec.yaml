name: marketplace_shared
description: Shared core, auth, theme, and utility code for the marketplace apps.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.10
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.3
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  lottie: ^3.3.0
  sentry_flutter: ^9.25.0
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.3
  flutter_local_notifications: ^18.0.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
