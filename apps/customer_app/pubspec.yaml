name: customer_app
description: Customer app for the local services marketplace.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  marketplace_shared:
    path: ../../packages/marketplace_shared
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.1
  firebase_database: ^11.3.3
  firebase_messaging: ^15.2.10
  firebase_storage: ^12.3.6
  cloud_firestore: ^5.6.6
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.3
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  lottie: ^3.3.0
  sentry_flutter: ^9.25.0
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.3
  razorpay_flutter: ^1.3.14
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.2
  sensors_plus: ^7.1.0
  custom_refresh_indicator: ^4.0.1
  flutter_animate: ^4.5.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.svg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher_icon.jpg"
  web:
    generate: true
    image_path: "assets/launcher_icon.jpg"
    background_color: "#ffffff"
    theme_color: "#ffffff"
