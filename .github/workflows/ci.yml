name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
          
      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veedufix?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/veedufix?schema=public
        run: npm run build
        
      - name: Run Linter
        run: npm run lint
        
      - name: Run Tests
        run: npm run test

  shared:
    name: Shared Package Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/marketplace_shared
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze code
        run: flutter analyze

  customer_app:
    name: Customer App Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/customer_app
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install shared dependencies
        working-directory: ./packages/marketplace_shared
        run: flutter pub get
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Generate files
        run: dart run build_runner build -d
        
      - name: Analyze code
        run: flutter analyze
        
      - name: Run Tests
        run: flutter test

      - name: Build Android debug app
        run: flutter build apk --debug

  worker_app:
    name: Worker App Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/worker_app
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install shared dependencies
        working-directory: ./packages/marketplace_shared
        run: flutter pub get
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze code
        run: flutter analyze
        
      - name: Run Tests
        run: flutter test || echo "No tests found yet"

      - name: Build Android debug app
        run: flutter build apk --debug

  admin_web:
    name: Admin Web Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/admin_web
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install shared dependencies
        working-directory: ./packages/marketplace_shared
        run: flutter pub get
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze code
        run: flutter analyze
        
      - name: Run Tests
        run: flutter test || echo "No tests found yet"

      - name: Build admin web release
        env:
          API_BASE_URL: https://veedufix.onrender.com/api
        run: flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=PRODUCTION=true
